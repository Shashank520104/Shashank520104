<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Now building FITFORGE, a 90-day backend and AI sprint, currently Day 12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C98F35"/>
      <stop offset="1" stop-color="#F0C97E"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1D222C"/>
    </pattern>
  </defs>

  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

    .pulse { animation: pulse 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(4.2); opacity: 0; } }

    .fill  { transform-box: fill-box; transform-origin: left center; animation: grow 1.8s cubic-bezier(.2,.8,.2,1) .4s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .row   { opacity: 1; animation: rise .7s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }

    .active-bg { animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .pulse { opacity: 0 !important; } }
  </style>

  <rect width="1200" height="300" rx="16" fill="url(#panel)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)" opacity=".7"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#232834"/>

  <!-- left: title -->
  <circle cx="76" cy="66" r="5" fill="none" stroke="#E3B15C"><animate attributeName="r" values="5;24" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="76" cy="66" r="5" fill="#E3B15C"/>
  <text class="mono" x="96" y="71" font-size="13" fill="#E3B15C" letter-spacing="4">NOW BUILDING</text>

  <text class="serif" x="72" y="156" font-size="72" fill="#E9E6DF">FIT<tspan fill="#E3B15C" font-style="italic">FORGE</tspan></text>
  <text class="mono" x="74" y="192" font-size="15" fill="#8A8F9C">Backend-first build  ·  a 90-day placement sprint</text>

  <text class="mono" x="74" y="242" font-size="13" fill="#E3B15C">MILESTONE 01</text>
  <text class="mono" x="74" y="262" font-size="13" fill="#B9BDC8">Trace a request from client to database</text>
  <text class="mono" x="74" y="280" font-size="13" fill="#B9BDC8">and debug it without an AI explaining it to me.</text>

  <!-- divider -->
  <line x1="590" y1="44" x2="590" y2="256" stroke="#232834"/>

  <!-- right: progress -->
  <text class="mono" x="640" y="71" font-size="12" fill="#6F7585" letter-spacing="3">SPRINT PROGRESS</text>
  <text class="serif" x="1130" y="76" font-size="34" fill="#E3B15C" text-anchor="end">Day 12<tspan fill="#6F7585" font-size="22"> / 90</tspan></text>

  <rect x="640" y="98" width="490" height="8" rx="4" fill="#1B2029"/>
  <rect x="640" y="98" width="65" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="0;65;65" keyTimes="0;.2;1" dur="8s" repeatCount="indefinite"/></rect><rect x="640" y="98" width="30" height="8" rx="4" fill="#FFF" opacity=".35"><animate attributeName="x" values="640;680;640" dur="2.4s" repeatCount="indefinite"/></rect>

  <!-- phases -->
  <g class="row" style="animation-delay:.9s">
    <rect class="active-bg" x="628" y="130" width="514" height="42" rx="8" fill="#E3B15C" fill-opacity=".08" stroke="#E3B15C" stroke-opacity=".35"/>
    <text class="mono" x="646" y="157" font-size="13" fill="#E3B15C">01</text>
    <text class="serif" x="684" y="158" font-size="21" fill="#E9E6DF">Foundations</text>
    <text class="mono" x="846" y="156" font-size="12" fill="#B9BDC8">JS/TS · Node · Express · Mongo · Auth</text>
  </g>
  <g class="row" style="animation-delay:1.1s">
    <text class="mono" x="646" y="205" font-size="13" fill="#5A6070">02</text>
    <text class="serif" x="684" y="206" font-size="21" fill="#7C8291">Architecture</text>
    <text class="mono" x="846" y="204" font-size="12" fill="#5A6070">Gateway · Redis · Docker · CI</text>
  </g>
  <g class="row" style="animation-delay:1.3s">
    <text class="mono" x="646" y="253" font-size="13" fill="#5A6070">03</text>
    <text class="serif" x="684" y="254" font-size="21" fill="#7C8291">AI + Interviews</text>
    <text class="mono" x="846" y="252" font-size="12" fill="#5A6070">LLM · RAG · D3 · System design</text>
  </g>
</svg>
