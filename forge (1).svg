<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="FITFORGE: build complete, going live next, post-launch updates after" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1218"/><stop offset="1" stop-color="#12151C"/></linearGradient>
<linearGradient id="bar" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#C98F35"/><stop offset="1" stop-color="#F0C97E"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1D222C"/></pattern>
</defs>
<rect width="1200" height="300" rx="16" fill="url(#panel)"/>
<rect width="1200" height="300" rx="16" fill="url(#dots)" opacity=".7"/>
<rect x=".5" y=".5" width="1199" height="299" rx="16" fill="none" stroke="#232834"/>

<circle cx="76" cy="66" r="5" fill="none" stroke="#E3B15C"><animate attributeName="r" values="5;24" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="76" cy="66" r="5" fill="#E3B15C"/>
<text x="96" y="71" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#E3B15C" letter-spacing="4">LATEST PROJECT</text>

<text x="72" y="156" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#E9E6DF">FIT<tspan fill="#E3B15C" font-style="italic">FORGE</tspan></text>
<text x="74" y="192" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8A8F9C">Build complete  ·  deploying live next</text>

<text x="74" y="242" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#E3B15C">NEXT UP</text>
<text x="74" y="262" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#B9BDC8">Ship the live link, then keep iterating</text>
<text x="74" y="280" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#B9BDC8">with post-launch updates.</text>

<line x1="590" y1="44" x2="590" y2="256" stroke="#232834"/>

<text x="640" y="71" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#6F7585" letter-spacing="3">PROJECT STATUS</text>
<text x="1130" y="76" font-family="Georgia,'Times New Roman',serif" font-size="34" fill="#E3B15C" text-anchor="end" font-style="italic">Going live</text>

<rect x="640" y="98" width="156" height="8" rx="4" fill="#5FB3A1"/>
<rect x="807" y="98" width="156" height="8" rx="4" fill="#1B2029"/>
<rect x="807" y="98" width="60" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="30;120;30" dur="4s" repeatCount="indefinite"/></rect>
<rect x="974" y="98" width="156" height="8" rx="4" fill="#1B2029"/>

<g>
<text x="646" y="157" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5FB3A1">01</text>
<text x="684" y="158" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#E9E6DF">Built</text>
<text x="846" y="156" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#B9BDC8">Core project complete</text>
<text x="1126" y="156" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5FB3A1" letter-spacing="2">DONE</text>
</g>
<g>
<rect x="628" y="178" width="514" height="42" rx="8" fill="#E3B15C" fill-opacity=".08" stroke="#E3B15C" stroke-opacity=".35"><animate attributeName="opacity" values=".5;1;.5" dur="3.2s" repeatCount="indefinite"/></rect>
<text x="646" y="205" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#E3B15C">02</text>
<text x="684" y="206" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#E9E6DF">Going live</text>
<text x="846" y="204" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#B9BDC8">Hosting &amp; deployment</text>
<text x="1126" y="204" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#E3B15C" letter-spacing="2">IN PROGRESS</text>
</g>
<g>
<text x="646" y="253" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5A6070">03</text>
<text x="684" y="254" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#7C8291">Post-launch</text>
<text x="846" y="252" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5A6070">Updates &amp; improvements</text>
<text x="1126" y="252" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5A6070" letter-spacing="2">NEXT</text>
</g>
</svg>
