<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="CGPA 8.55, 228 plus DSA problems, LeetCode contest rating 1420, 2 internships" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
  </defs>

  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .c { opacity: 1; animation: rise .8s ease-out both; }
    .c2 { animation-delay: .15s; } .c3 { animation-delay: .3s; } .c4 { animation-delay: .45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <rect width="1200" height="170" rx="16" fill="url(#panel)"/>
  <rect x=".5" y=".5" width="1199" height="169" rx="16" fill="none" stroke="#232834"/>

  <line x1="300" y1="34" x2="300" y2="136" stroke="#232834"/>
  <line x1="600" y1="34" x2="600" y2="136" stroke="#232834"/>
  <line x1="900" y1="34" x2="900" y2="136" stroke="#232834"/>

  <g class="c" text-anchor="middle">
    <text class="serif" x="150" y="84" font-size="58" fill="#E3B15C">8.55</text>
    <text class="mono" x="150" y="112" font-size="13" fill="#E9E6DF" letter-spacing="2">CGPA</text>
    <text class="mono" x="150" y="132" font-size="11.5" fill="#6F7585">B.Tech CSE · Bennett University</text>
  </g>
  <g class="c c2" text-anchor="middle">
    <text class="serif" x="450" y="84" font-size="58" fill="#E3B15C">228<tspan font-size="40" font-style="italic">+</tspan></text>
    <text class="mono" x="450" y="112" font-size="13" fill="#E9E6DF" letter-spacing="2">DSA PROBLEMS</text>
    <text class="mono" x="450" y="132" font-size="11.5" fill="#6F7585">LeetCode + GeeksforGeeks</text>
  </g>
  <g class="c c3" text-anchor="middle">
    <text class="serif" x="750" y="84" font-size="58" fill="#E3B15C">1420</text>
    <text class="mono" x="750" y="112" font-size="13" fill="#E9E6DF" letter-spacing="2">CONTEST RATING</text>
    <text class="mono" x="750" y="132" font-size="11.5" fill="#6F7585">3 rated LeetCode contests</text>
  </g>
  <g class="c c4" text-anchor="middle">
    <text class="serif" x="1050" y="84" font-size="58" fill="#E3B15C">2</text>
    <text class="mono" x="1050" y="112" font-size="13" fill="#E9E6DF" letter-spacing="2">INTERNSHIPS</text>
    <text class="mono" x="1050" y="132" font-size="11.5" fill="#6F7585">BAOIAM · Zidio Development</text>
  </g>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#E3B15C" stop-opacity="0"/><stop offset=".5" stop-color="#E3B15C" stop-opacity=".5"/><stop offset="1" stop-color="#E3B15C" stop-opacity="0"/></linearGradient></defs><rect x="0" y="166" width="300" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" values="-300 0;1200 0" dur="4s" repeatCount="indefinite"/></rect><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#E3B15C" stop-opacity="0"/><stop offset=".5" stop-color="#E3B15C" stop-opacity=".5"/><stop offset="1" stop-color="#E3B15C" stop-opacity="0"/></linearGradient></defs><rect x="0" y="166" width="300" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" values="-300 0;1200 0" dur="4s" repeatCount="indefinite"/></rect><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#E3B15C" stop-opacity="0"/><stop offset=".5" stop-color="#E3B15C" stop-opacity=".5"/><stop offset="1" stop-color="#E3B15C" stop-opacity="0"/></linearGradient></defs><rect x="0" y="166" width="300" height="3" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" values="-300 0;1200 0" dur="4s" repeatCount="indefinite"/></rect></svg>
