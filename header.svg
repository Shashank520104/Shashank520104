<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Shashank Kumar, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3B15C" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E3B15C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#E3B15C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E3B15C"/>
      <stop offset="1" stop-color="#E3B15C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B0D12" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0B0D12" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C212B" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>

  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

    .grid  { animation: drift 10s linear infinite; }
    @keyframes drift { to { transform: translate(40px, 40px); } }

    .glow  { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }

    .ring  { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .orbit { animation: spin 14s linear infinite; transform-origin: 1020px 170px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sweep { animation: slide 6s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-420px); } to { transform: translateX(1220px); } }

    .rise  { opacity: 0; animation: rise .9s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .role  { opacity: 0; clip-path: inset(0 100% 0 0); animation: type 16s infinite both; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
    @keyframes type {
      0%     { opacity: 1; clip-path: inset(0 100% 0 0); animation-timing-function: steps(26, end); }
      12%    { opacity: 1; clip-path: inset(0 0 0 0); }
      22%    { opacity: 1; clip-path: inset(0 0 0 0); }
      24%    { opacity: 0; clip-path: inset(0 0 0 0); }
      24.01%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
    }

    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .role { opacity: 0; clip-path: none; }
      .r1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect class="grid" x="-40" y="-40" width="1240" height="380" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#fade)"/>
    <ellipse class="glow" cx="1020" cy="170" rx="300" ry="230" fill="url(#glow)"/>

    <!-- monogram -->
    <g>
      <circle class="ring" cx="1020" cy="170" r="104" fill="none" stroke="#2B313D" stroke-width="1.5" stroke-dasharray="3 9"/>
      <circle cx="1020" cy="170" r="78" fill="none" stroke="#E3B15C" stroke-opacity=".45" stroke-width="1"/>
      <g class="orbit"><circle cx="1124" cy="170" r="4.5" fill="#E3B15C"/></g>
      <text class="serif" x="1020" y="190" text-anchor="middle" font-size="58" fill="#E9E6DF" letter-spacing="2">S<tspan fill="#E3B15C" font-style="italic">K</tspan></text>
    </g>

    <!-- copy -->
    <text class="mono rise" x="72" y="86" font-size="13" fill="#8A8F9C" letter-spacing="3.2" style="animation-delay:.1s">// FULL STACK  ·  BACKEND-LEANING  ·  AI-INTEGRATED</text>

    <text class="serif rise" x="72" y="186" font-size="88" fill="#E9E6DF" style="animation-delay:.3s">Shashank <tspan fill="#E3B15C" font-style="italic">Kumar</tspan></text>

    <rect class="rise" x="74" y="212" width="120" height="2" fill="#E3B15C" style="animation-delay:.6s"/>

    <g class="rise" style="animation-delay:.8s">
      <text class="mono" x="72" y="262" font-size="24" fill="#E3B15C">$</text>
      <text class="mono role r1" x="102" y="262" font-size="24" fill="#E9E6DF">Full Stack Developer (MERN)</text>
      <text class="mono role r2" x="102" y="262" font-size="24" fill="#E9E6DF">Backend + AI integration</text>
      <text class="mono role r3" x="102" y="262" font-size="24" fill="#E9E6DF">Open to internships &amp; placement</text>
      <text class="mono role r4" x="102" y="262" font-size="24" fill="#E9E6DF">C++ problem solver</text>
    </g>

    <text class="mono rise" x="72" y="314" font-size="13" fill="#6F7585" style="animation-delay:1s">Greater Noida  ·  B.Tech CSE '28, Bennett University  ·  Full Stack Intern @ BAOIAM</text>

    <rect class="sweep" x="0" y="335" width="420" height="5" fill="url(#sweep)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="16" fill="none" stroke="#232834"/>
</svg>
