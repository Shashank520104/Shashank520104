<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Architecting clean logic. Lifting heavy code." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#12151C"/>
    </linearGradient>
  </defs>

  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .line  { transform-box: fill-box; transform-origin: center; animation: draw 3.6s ease-in-out infinite; }
    @keyframes draw { 0%,100% { transform: scaleX(.15); opacity: .5; } 50% { transform: scaleX(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="140" rx="16" fill="url(#panel)"/>
  <rect x=".5" y=".5" width="1199" height="139" rx="16" fill="none" stroke="#232834"/>

  <text class="serif" x="600" y="68" text-anchor="middle" font-size="32" font-style="italic" fill="#E9E6DF">Architecting clean logic. <tspan fill="#E3B15C">Lifting heavy code.</tspan></text>
  <rect class="line" x="470" y="84" width="260" height="2" fill="#E3B15C"/>
  <text class="mono" x="600" y="116" text-anchor="middle" font-size="12.5" fill="#6F7585" letter-spacing="2">OPEN TO INTERNSHIPS &amp; PLACEMENT  ·  LET'S BUILD SOMETHING THAT SHIPS</text>
</svg>
